<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Client — Pierre Créa Web</title>
<link rel="icon" href="../logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="theme-color" content="#0B1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PCW Client">
<style>
  :root{
    --bg:#FBFDFE; --accent:#2C96D8; --accent-dark:#1D74AC; --accent-light:#E7F4FC;
    --card:#FFFFFF; --text:#070F13; --muted:#69787F; --border:#E2EDF2;
    --danger:#D9534F; --success:#3FA772; --input-bg:#F4FAFD;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow-lg:0 12px 32px rgba(16,24,40,.12),0 2px 6px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Inter",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  input{font-family:inherit;}

  #auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%, #16233F 0%, #0B1220 55%, #060A12 100%);padding:20px;}
  .auth-box{background:var(--card);padding:40px 40px 34px;border-radius:16px;width:360px;max-width:90vw;box-shadow:var(--shadow-lg);}
  .auth-box h1{font-size:21px;margin:0 0 4px;color:var(--text);font-weight:700;text-align:center;}
  .auth-box p.sub{color:var(--muted);font-size:13px;margin:0 0 22px;text-align:center;}
  .auth-box input{width:100%;padding:11px 13px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--input-bg);color:var(--text);transition:.15s;outline:none;}
  .auth-box input:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px var(--accent-light);}
  .auth-box button.primary{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;box-shadow:var(--shadow-sm);cursor:pointer;transition:.15s;}
  .auth-box button.primary:hover{background:var(--accent-dark);transform:translateY(-1px);}
  .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
  .auth-switch a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600;}
  .auth-switch a:hover{text-decoration:underline;}
  .auth-error{background:#FDECEB;color:var(--danger);padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;display:none;}
  .auth-success{background:#E9F7EF;color:var(--success);padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;display:none;}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <img src="../logo.png" alt="PCW" style="width:76px;height:76px;display:block;margin:0 auto 10px;">
    <h1 id="card-title">Connexion</h1>
    <p class="sub" id="card-lead">Espace Client PCW — accède à ton compte</p>
    <div class="auth-error" id="login-msg"></div>
    <div class="auth-error" id="signup-msg"></div>
    <div class="auth-error" id="reset-msg"></div>
    <div class="auth-error" id="reset-confirm-msg"></div>

    <div id="form-login">
      <input type="email" id="login-email" placeholder="Adresse email" autocomplete="username">
      <input type="password" id="login-password" placeholder="Mot de passe" autocomplete="current-password">
      <button class="primary" onclick="login()">Se connecter</button>
      <div class="auth-switch">
        <a onclick="switchTab('reset')">Mot de passe oublié ?</a>
      </div>
      <div class="auth-switch">
        <span>Pas encore de compte ?</span>
        <a onclick="switchTab('signup')">Créer un compte</a>
      </div>
    </div>

    <div id="form-signup" style="display:none;">
      <input type="text" id="signup-nom" placeholder="Ton nom ou ta société">
      <input type="email" id="signup-email" placeholder="Adresse email" autocomplete="username">
      <input type="password" id="signup-password" placeholder="Mot de passe" autocomplete="new-password">
      <button class="primary" onclick="signup()">Créer mon compte</button>
      <div class="auth-switch">
        <a onclick="switchTab('login')">← Retour à la connexion</a>
      </div>
    </div>

    <div id="form-reset" style="display:none;">
      <input type="email" id="reset-email" placeholder="Adresse email" autocomplete="username">
      <button class="primary" onclick="requestReset()">Envoyer le lien</button>
      <div class="auth-switch">
        <a onclick="switchTab('login')">← Retour à la connexion</a>
      </div>
    </div>

    <div id="form-reset-confirm" style="display:none;">
      <input type="password" id="reset-password" placeholder="Nouveau mot de passe" autocomplete="new-password">
      <input type="password" id="reset-password2" placeholder="Confirmer le nouveau mot de passe" autocomplete="new-password">
      <button class="primary" onclick="confirmReset()">Réinitialiser le mot de passe</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://chlmceyretciqydrdpgp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JXUR4NfJQB4V5F8prZ3kjQ_RvVuNQ7q";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function switchTab(tab) {
  document.getElementById("form-login").style.display = tab === "login" ? "block" : "none";
  document.getElementById("form-signup").style.display = tab === "signup" ? "block" : "none";
  document.getElementById("form-reset").style.display = tab === "reset" ? "block" : "none";
  document.getElementById("form-reset-confirm").style.display = tab === "reset-confirm" ? "block" : "none";
  const titles = {
    login: ["Connexion", "Espace Client PCW — accède à ton compte"],
    signup: ["Créer un compte", "Rejoins ton espace client Pierre Créa Web."],
    reset: ["Mot de passe oublié", "Reçois un lien pour choisir un nouveau mot de passe"],
    "reset-confirm": ["Nouveau mot de passe", "Choisis un nouveau mot de passe pour ton compte"],
  };
  document.getElementById("card-title").textContent = titles[tab][0];
  document.getElementById("card-lead").textContent = titles[tab][1];
  ["login-msg", "signup-msg", "reset-msg", "reset-confirm-msg"].forEach(id => {
    const el = document.getElementById(id);
    el.style.display = "none"; el.className = "auth-error";
  });
}

function showMsg(id, text, isSuccess) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = isSuccess ? "auth-success" : "auth-error";
  el.style.display = "block";
}

async function requestReset() {
  const email = document.getElementById("reset-email").value.trim();
  if (!email) { showMsg("reset-msg", "Renseigne ton adresse email."); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split("#")[0].split("?")[0] });
  if (error) { showMsg("reset-msg", error.message); return; }
  showMsg("reset-msg", "Email envoyé ! Vérifie ta boîte mail (et tes spams) et clique sur le lien reçu.", true);
}

async function confirmReset() {
  const password = document.getElementById("reset-password").value;
  const password2 = document.getElementById("reset-password2").value;
  if (!password || password.length < 6) { showMsg("reset-confirm-msg", "Le mot de passe doit faire au moins 6 caractères."); return; }
  if (password !== password2) { showMsg("reset-confirm-msg", "Les deux mots de passe ne correspondent pas."); return; }
  const { error } = await sb.auth.updateUser({ password });
  if (error) { showMsg("reset-confirm-msg", error.message); return; }
  window.location.href = "dashboard.html";
}

async function login() {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  document.getElementById("login-msg").style.display = "none";
  if (!email || !password) { showMsg("login-msg", "Merci de remplir email et mot de passe."); return; }

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { showMsg("login-msg", error.message); return; }
  window.location.href = "dashboard.html";
}

async function signup() {
  const nom = document.getElementById("signup-nom").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const password = document.getElementById("signup-password").value;
  document.getElementById("signup-msg").style.display = "none";
  if (!nom || !email || !password) { showMsg("signup-msg", "Tous les champs sont requis."); return; }
  if (password.length < 6) { showMsg("signup-msg", "Le mot de passe doit faire au moins 6 caractères."); return; }

  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { showMsg("signup-msg", error.message); return; }
  if (!data.user) { showMsg("signup-msg", "Compte créé ! Vérifie tes emails pour confirmer, puis connecte-toi."); return; }

  // 0) Un déclencheur côté base de données relie déjà automatiquement le
  // compte à une fiche contact (voir migration-portail-client-15.sql).
  // On vérifie d'abord si c'est déjà fait, pour ne jamais créer de doublon.
  const { data: dejaRelie } = await sb.from("contacts").select("id").eq("client_user_id", data.user.id).limit(1);
  if (dejaRelie && dejaRelie.length > 0) { finishSignup(data.session); return; }

  // 1) Filet de sécurité si le déclencheur n'a pas (encore) tourné : essaie
  // de se rattacher à une fiche contact déjà créée par PCW (email identique).
  // .limit(1) évite toute ambiguïté s'il existe plusieurs fiches avec le même email.
  const { data: existing } = await sb
    .from("contacts")
    .select("id")
    .ilike("email", email)
    .is("client_user_id", null)
    .order("id", { ascending: true })
    .limit(1);

  if (existing && existing.length > 0) {
    const { data: claimed, error: claimError } = await sb
      .from("contacts")
      .update({ client_user_id: data.user.id })
      .eq("id", existing[0].id)
      .select();
    if (!claimError && claimed && claimed.length > 0) {
      finishSignup(data.session);
      return;
    }
  }

  // 2) Sinon, crée sa propre fiche contact
  const { data: ownerId, error: ownerError } = await sb.rpc("owner_id");
  if (ownerError || !ownerId) {
    showMsg("signup-msg", "Compte créé, mais impossible de finaliser ton profil. Contacte PCW.");
    return;
  }
  const { error: insertError } = await sb.from("contacts").insert({
    user_id: ownerId, client_user_id: data.user.id, nom, email,
    date_creation: new Date().toISOString().slice(0, 16).replace("T", " "),
  });
  if (insertError) {
    showMsg("signup-msg", "Compte créé, mais erreur profil : " + insertError.message);
    return;
  }
  finishSignup(data.session);
}

function finishSignup(session) {
  if (session) window.location.href = "dashboard.html";
  else showMsg("signup-msg", "Compte créé ! Vérifie tes emails pour confirmer, puis connecte-toi.");
}

let isRecoveryFlow = false;
sb.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    isRecoveryFlow = true;
    switchTab("reset-confirm");
  }
});

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session && !isRecoveryFlow) window.location.href = "dashboard.html";
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
