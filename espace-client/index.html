<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Client — Pierre Créa Web</title>
<link rel="icon" href="../logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="theme-color" content="#0B1B36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PCW Client">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#29a8f0; --indigo:#2946b0; --navy:#0b1b36; --paper:#fff;
    --cloud:#f3f6fc; --line:#e3e8f2; --slate:#5b6b8c;
    --grad: linear-gradient(135deg, var(--sky) 0%, var(--indigo) 100%);
    --radius:16px; --shadow:0 30px 60px -20px rgba(11,27,54,.5);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--navy); position:relative; overflow-x:hidden;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--navy);
  }
  body::before{
    content:""; position:fixed; inset:0;
    background:
      radial-gradient(circle at 18% 15%, rgba(41,168,240,.28), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(41,70,176,.5), transparent 50%);
    pointer-events:none;
  }
  h1,.display{font-family:'Space Grotesk',sans-serif;}
  .scene{position:relative; width:100%; max-width:380px;}

  .brand{display:flex; align-items:center; gap:11px; margin-bottom:28px; padding:0 2px;}
  .brand img{height:38px; width:38px; border-radius:9px;}
  .brand .name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.05rem; color:#fff;}
  .brand .sub{font-size:.68rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:#9db3de;}

  .card{
    background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:30px 28px;
  }
  .card h1{font-size:1.25rem; margin:0 0 4px; letter-spacing:-.01em;}
  .card p.lead{margin:0 0 22px; font-size:.85rem; color:var(--slate);}

  .tab-toggle{display:flex; gap:6px; margin-bottom:20px; background:var(--cloud); border-radius:10px; padding:4px;}
  .tab-toggle button{
    flex:1; padding:9px; border-radius:8px; border:none; background:transparent;
    cursor:pointer; font-weight:600; font-size:.83rem; color:var(--slate); font-family:'Inter',sans-serif;
    transition:background .15s, color .15s;
  }
  .tab-toggle button.active{background:var(--paper); color:var(--navy); box-shadow:0 1px 3px rgba(11,27,54,.1);}

  label{display:block; font-size:.78rem; font-weight:600; color:var(--slate); margin:14px 0 5px;}
  label:first-of-type{margin-top:0;}
  input{
    width:100%; padding:10px 13px; border:1.5px solid var(--line); border-radius:9px;
    font-size:.92rem; font-family:'Inter',sans-serif; color:var(--navy); outline:none; transition:border-color .15s;
  }
  input:focus{border-color:var(--sky);}
  .btn-primary{
    margin-top:20px; width:100%; background:var(--grad); color:#fff; border:none;
    padding:11px 20px; border-radius:9px; font-weight:600; cursor:pointer; font-size:.9rem;
    transition:opacity .15s, transform .1s;
  }
  .btn-primary:hover{opacity:.92;}
  .btn-primary:active{transform:scale(.98);}
  .error-msg{color:#dc2626; font-size:.82rem; margin-top:10px;}
  .success-msg{color:#15a26b; font-size:.82rem; margin-top:10px;}
</style>
</head>
<body>

<div class="scene">
  <div class="brand">
    <img src="../logo.png" alt="PCW">
    <div><div class="name">PCW</div><div class="sub">Espace Client</div></div>
  </div>

  <div class="card">
    <h1 id="card-title">Bon retour</h1>
    <p class="lead" id="card-lead">Connecte-toi pour retrouver ton espace.</p>

    <div class="tab-toggle">
      <button id="tab-login" class="active" onclick="switchTab('login')">Connexion</button>
      <button id="tab-signup" onclick="switchTab('signup')">Créer un compte</button>
    </div>

    <div id="form-login">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="toi@exemple.fr">
      <label for="login-password">Mot de passe</label>
      <input type="password" id="login-password" placeholder="••••••••">
      <button class="btn-primary" onclick="login()">Se connecter</button>
      <div id="login-msg"></div>
    </div>

    <div id="form-signup" style="display:none;">
      <label for="signup-nom">Nom / société</label>
      <input type="text" id="signup-nom" placeholder="Ton nom ou ta société">
      <label for="signup-email">Email</label>
      <input type="email" id="signup-email" placeholder="toi@exemple.fr">
      <label for="signup-password">Mot de passe</label>
      <input type="password" id="signup-password" placeholder="••••••••">
      <button class="btn-primary" onclick="signup()">Créer mon compte</button>
      <div id="signup-msg"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://chlmceyretciqydrdpgp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JXUR4NfJQB4V5F8prZ3kjQ_RvVuNQ7q";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function switchTab(tab) {
  const isLogin = tab === "login";
  document.getElementById("tab-login").classList.toggle("active", isLogin);
  document.getElementById("tab-signup").classList.toggle("active", !isLogin);
  document.getElementById("form-login").style.display = isLogin ? "block" : "none";
  document.getElementById("form-signup").style.display = isLogin ? "none" : "block";
  document.getElementById("card-title").textContent = isLogin ? "Bon retour" : "Créer un compte";
  document.getElementById("card-lead").textContent = isLogin ? "Connecte-toi pour retrouver ton espace." : "Rejoins ton espace client Pierre Créa Web.";
}

async function login() {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const msgEl = document.getElementById("login-msg");
  msgEl.innerHTML = "";
  if (!email || !password) { msgEl.innerHTML = '<div class="error-msg">Merci de remplir email et mot de passe.</div>'; return; }

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { msgEl.innerHTML = `<div class="error-msg">${error.message}</div>`; return; }
  window.location.href = "dashboard.html";
}

async function signup() {
  const nom = document.getElementById("signup-nom").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const password = document.getElementById("signup-password").value;
  const msgEl = document.getElementById("signup-msg");
  msgEl.innerHTML = "";
  if (!nom || !email || !password) { msgEl.innerHTML = '<div class="error-msg">Tous les champs sont requis.</div>'; return; }
  if (password.length < 6) { msgEl.innerHTML = '<div class="error-msg">Le mot de passe doit faire au moins 6 caractères.</div>'; return; }

  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { msgEl.innerHTML = `<div class="error-msg">${error.message}</div>`; return; }
  if (!data.user) { msgEl.innerHTML = '<div class="success-msg">Compte créé ! Vérifie tes emails pour confirmer, puis connecte-toi.</div>'; return; }

  // 1) Essaie de se rattacher à une fiche contact déjà créée par PCW (email identique).
  // .limit(1) évite toute ambiguïté s'il existe plusieurs fiches avec le même email.
  const { data: existing } = await sb
    .from("contacts")
    .select("id")
    .ilike("email", email)
    .is("client_user_id", null)
    .order("id", { ascending: true })
    .limit(1);

  if (existing && existing.length > 0) {
    const { data: claimed, error: claimError } = await sb
      .from("contacts")
      .update({ client_user_id: data.user.id })
      .eq("id", existing[0].id)
      .select();
    if (!claimError && claimed && claimed.length > 0) {
      finishSignup(data.session);
      return;
    }
  }

  // 2) Sinon, crée sa propre fiche contact
  const { data: ownerId, error: ownerError } = await sb.rpc("owner_id");
  if (ownerError || !ownerId) {
    msgEl.innerHTML = '<div class="error-msg">Compte créé, mais impossible de finaliser ton profil. Contacte PCW.</div>';
    return;
  }
  const { error: insertError } = await sb.from("contacts").insert({
    user_id: ownerId, client_user_id: data.user.id, nom, email,
    date_creation: new Date().toISOString().slice(0, 16).replace("T", " "),
  });
  if (insertError) {
    msgEl.innerHTML = `<div class="error-msg">Compte créé, mais erreur profil : ${insertError.message}</div>`;
    return;
  }
  finishSignup(data.session);
}

function finishSignup(session) {
  if (session) window.location.href = "dashboard.html";
  else document.getElementById("signup-msg").innerHTML = '<div class="success-msg">Compte créé ! Vérifie tes emails pour confirmer, puis connecte-toi.</div>';
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) window.location.href = "dashboard.html";
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

</script>
</body>
</html>
